name: CONCEDE Motor V3 checks

on:
  push:
    branches:
      - motor-v3
      - feature/mailing-motor-v3
      - feature/denue-contact-enrichment
  pull_request:
    branches:
      - motor-v3

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile application and Mailing modules
        run: python -m compileall -q app.py core.py executive_front.py mailing_store.py mailing_auth.py mailing_service.py mailing_ui.py denue_enrichment.py
      - name: Run Mailing regression tests
        run: python -m pytest -q tests/test_mailing_service.py tests/test_mailing_store.py tests/test_denue_enrichment.py
